[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "google_genai"
authors = [
    { name = "NDS Technologies", email = "admin@nds.com" }
]
description = "Google Gemini AI integration for ERPNext order processing and ticketing"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]

# Dependencies required by this custom app
dependencies = [
    "google-genai"
]

[project.urls]
Homepage = "https://github.com/nds-technologies/google_genai"
Repository = "https://github.com/nds-technologies/google_genai"

[tool.flit.module]
name = "google_genai"
